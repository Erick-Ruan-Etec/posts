<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Blog</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg: #0e0e0e;
                --surface: #161616;
                --border: #2a2a2a;
                --text: #f0ece4;
                --muted: #888;
                --accent: #e8c97e;
                --accent2: #c46a3a;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background: var(--bg);
                color: var(--text);
                font-family: "DM Sans", sans-serif;
                min-height: 100vh;
            }

            /* ── Header ── */
            header {
                border-bottom: 1px solid var(--border);
                padding: 0 clamp(1.5rem, 5vw, 4rem);
                display: flex;
                align-items: center;
                justify-content: space-between;
                height: 64px;
                position: sticky;
                top: 0;
                background: rgba(14, 14, 14, 0.92);
                backdrop-filter: blur(12px);
                z-index: 100;
            }

            .logo {
                font-family: "Playfair Display", serif;
                font-size: 1.4rem;
                font-weight: 900;
                letter-spacing: -0.02em;
                color: var(--accent);
                text-decoration: none;
            }

            .nav-links {
                display: flex;
                gap: 1.5rem;
                align-items: center;
            }
            .nav-links a {
                color: var(--muted);
                text-decoration: none;
                font-size: 0.85rem;
                font-weight: 500;
                letter-spacing: 0.05em;
                text-transform: uppercase;
                transition: color 0.2s;
            }
            .nav-links a:hover {
                color: var(--text);
            }

            /* ── Hero ── */
            .hero {
                padding: clamp(3rem, 8vw, 6rem) clamp(1.5rem, 5vw, 4rem);
                max-width: 900px;
            }

            .hero-label {
                font-size: 0.75rem;
                letter-spacing: 0.15em;
                text-transform: uppercase;
                color: var(--accent);
                margin-bottom: 1rem;
            }

            .hero h1 {
                font-family: "Playfair Display", serif;
                font-size: clamp(2.8rem, 6vw, 5rem);
                font-weight: 900;
                line-height: 1.05;
                letter-spacing: -0.03em;
                color: var(--text);
            }

            .hero h1 em {
                font-style: italic;
                color: var(--accent);
            }

            /* ── Main layout ── */
            main {
                padding: 0 clamp(1.5rem, 5vw, 4rem) 4rem;
                max-width: 1200px;
            }

            .section-header {
                display: flex;
                align-items: center;
                gap: 1rem;
                margin-bottom: 2rem;
                padding-top: 2.5rem;
            }

            .section-header h2 {
                font-family: "Playfair Display", serif;
                font-size: 1.6rem;
                font-weight: 700;
            }

            .section-header::after {
                content: "";
                flex: 1;
                height: 1px;
                background: var(--border);
            }

            /* ── Post Grid ── */
            .posts-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
                gap: 1.5rem;
            }

            .post-card {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 4px;
                overflow: hidden;
                cursor: pointer;
                transition:
                    border-color 0.25s,
                    transform 0.2s;
                text-decoration: none;
                display: block;
            }

            .post-card:hover {
                border-color: var(--accent);
                transform: translateY(-3px);
            }

            .card-cover {
                height: 6px;
            }

            .card-body {
                padding: 1.5rem;
            }

            .card-tags {
                display: flex;
                flex-wrap: wrap;
                gap: 0.4rem;
                margin-bottom: 0.8rem;
            }

            .tag {
                font-size: 0.65rem;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: var(--accent);
                background: rgba(232, 201, 126, 0.1);
                padding: 2px 8px;
                border-radius: 2px;
            }

            .card-title {
                font-family: "Playfair Display", serif;
                font-size: 1.25rem;
                font-weight: 700;
                line-height: 1.3;
                margin-bottom: 0.6rem;
                color: var(--text);
            }

            .card-excerpt {
                font-size: 0.88rem;
                color: var(--muted);
                line-height: 1.6;
                display: -webkit-box;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }

            .card-footer {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-top: 1.2rem;
                padding-top: 1rem;
                border-top: 1px solid var(--border);
            }

            .card-author {
                font-size: 0.78rem;
                color: var(--muted);
            }

            .card-date {
                font-size: 0.72rem;
                color: var(--border);
                letter-spacing: 0.05em;
            }

            /* ── Loading / Empty ── */
            .state-msg {
                text-align: center;
                padding: 4rem 2rem;
                color: var(--muted);
            }

            .state-msg .icon {
                font-size: 3rem;
                margin-bottom: 1rem;
                opacity: 0.4;
            }

            .spinner {
                width: 32px;
                height: 32px;
                border: 2px solid var(--border);
                border-top-color: var(--accent);
                border-radius: 50%;
                animation: spin 0.7s linear infinite;
                margin: 0 auto 1rem;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            /* ── Responsive ── */
            @media (max-width: 600px) {
                .posts-grid {
                    grid-template-columns: 1fr;
                }
            }
        </style>
    </head>
    <body>
        <header>
            <a href="/" class="logo">The Blog</a>
            <nav class="nav-links">
                <a href="/">Posts</a>
                <a href="/admin.html">Admin</a>
            </nav>
        </header>

        <div class="hero">
            <p class="hero-label">Publicações recentes</p>
            <h1>Ideias que <em>valem</em><br />ser lidas.</h1>
        </div>

        <main>
            <div class="section-header">
                <h2>Todos os posts</h2>
            </div>

            <div id="posts-container">
                <div class="state-msg">
                    <div class="spinner"></div>
                    <p>Carregando posts…</p>
                </div>
            </div>
        </main>

        <script>
            const API = "/api";

            function formatDate(iso) {
                return new Date(iso).toLocaleDateString("pt-BR", {
                    day: "2-digit",
                    month: "short",
                    year: "numeric",
                });
            }

            function excerpt(text, len = 140) {
                return text.length > len ? text.slice(0, len) + "…" : text;
            }

            async function loadPosts() {
                const container = document.getElementById("posts-container");
                try {
                    const res = await fetch(`${API}/posts`);
                    const posts = await res.json();

                    if (!posts.length) {
                        container.innerHTML = `
          <div class="state-msg">
            <div class="icon">✦</div>
            <p>Nenhum post publicado ainda.</p>
          </div>`;
                        return;
                    }

                    container.innerHTML = `<div class="posts-grid">${posts.map(renderCard).join("")}</div>`;
                } catch (e) {
                    container.innerHTML = `
        <div class="state-msg">
          <div class="icon">⚠</div>
          <p>Erro ao carregar posts. Verifique a API.</p>
        </div>`;
                }
            }

            function renderCard(post) {
                const tags = (post.tags || [])
                    .map((t) => `<span class="tag">${t}</span>`)
                    .join("");
                return `
      <a class="post-card" href="/post.html?id=${post.id}">
        <div class="card-cover" style="background:${post.coverColor || "#e8c97e"}"></div>
        <div class="card-body">
          ${tags ? `<div class="card-tags">${tags}</div>` : ""}
          <div class="card-title">${post.title}</div>
          <div class="card-excerpt">${excerpt(post.content)}</div>
          <div class="card-footer">
            <span class="card-author">Por ${post.author}</span>
            <span class="card-date">${formatDate(post.createdAt)}</span>
          </div>
        </div>
      </a>`;
            }

            loadPosts();
        </script>
    </body>
</html>
